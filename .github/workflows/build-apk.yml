name: Build NodeChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/prashantgdev/nodechat
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/values

      - name: Create settings.gradle
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NodeChat"
          include ':app'
          EOF

      - name: Create root build.gradle
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app build.gradle
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.prashantgdev.nodechat'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.prashantgdev.nodechat'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.10.1'
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="NodeChat"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create activity_main.xml
        run: |
          cat > android/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <FrameLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <ProgressBar
                  android:id="@+id/progressBar"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center" />

          </FrameLayout>
          EOF

      - name: Create styles.xml
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>

              </style>

          </resources>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > android/app/src/main/java/com/prashantgdev/nodechat/MainActivity.java <<'EOF'
          package com.prashantgdev.nodechat;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private View progressBar;

              private static final String WEBSITE_URL =
                      "https://node-chat-pyfg.onrender.com";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          view.loadUrl(request.getUrl().toString());
                          return true;
                      }

                      @Override
                      public void onPageFinished(
                              WebView view,
                              String url) {

                          progressBar.setVisibility(View.GONE);

                          super.onPageFinished(view, url);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl(WEBSITE_URL);

                  getOnBackPressedDispatcher().addCallback(
                          this,
                          new OnBackPressedCallback(true) {

                              @Override
                              public void handleOnBackPressed() {

                                  if (webView.canGoBack()) {
                                      webView.goBack();
                                  } else {
                                      finish();
                                  }
                              }
                          }
                  );
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip

      - name: Build APK
        working-directory: android
        run: |
          ../gradle-8.10.2/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NodeChat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

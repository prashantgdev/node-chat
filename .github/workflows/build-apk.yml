name: Build NodeChat APK

#on:
#  push:
#    branches:
#      - main

#  workflow_dispatch:
  
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  LOGO_PATH: public/images/logo.png

jobs:
  build:
    name: Build NodeChat APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Get the repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Check that the logo exists
      # --------------------------------------------------

      - name: Check logo
        run: |
          echo "Using logo: $LOGO_PATH"

          if [ ! -f "$LOGO_PATH" ]; then
            echo "ERROR: Logo not found at $LOGO_PATH"
            exit 1
          fi

          echo "Logo found successfully."


      # --------------------------------------------------
      # 3. Setup Java
      # --------------------------------------------------

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 4. Setup Android SDK
      # --------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # --------------------------------------------------
      # 5. Install Android SDK packages
      # --------------------------------------------------

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # 6. Generate launcher icons from logo.png
      # --------------------------------------------------

      - name: Generate Android launcher icons
        run: |

          sudo apt-get update

          sudo apt-get install -y imagemagick

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert "$LOGO_PATH" \
            -resize 48x48 \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert "$LOGO_PATH" \
            -resize 72x72 \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert "$LOGO_PATH" \
            -resize 96x96 \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert "$LOGO_PATH" \
            -resize 144x144 \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert "$LOGO_PATH" \
            -resize 192x192 \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Android launcher icons generated."


      # --------------------------------------------------
      # 7. Download Gradle
      # --------------------------------------------------

      - name: Download Gradle
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q gradle-8.10.2-bin.zip


      # --------------------------------------------------
      # 8. Build APK
      # --------------------------------------------------

      - name: Build Debug APK
        working-directory: android
        run: |
          ../gradle-8.10.2/bin/gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 9. Copy APK to repository root
      # --------------------------------------------------

      - name: Copy APK
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            NodeChat.apk


      # --------------------------------------------------
      # 10. Create release version
      # --------------------------------------------------

      - name: Generate release version
        id: version
        run: |
          echo "version=v1.0.${GITHUB_RUN_NUMBER}" \
            >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 11. Create GitHub Release
      # --------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: ${{ steps.version.outputs.version }}

          name: NodeChat ${{ steps.version.outputs.version }}

          body: |
            ## NodeChat Android App

            Download NodeChat.apk below.

            Built automatically using GitHub Actions.

          files: |
            NodeChat.apk

          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
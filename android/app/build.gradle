plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prashantgdev.nodechat'

    compileSdk 35

    defaultConfig {
        applicationId 'com.prashantgdev.nodechat'

        minSdk 23
        targetSdk 35

        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
}